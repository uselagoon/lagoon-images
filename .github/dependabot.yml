version: 2
updates:
  # Docker image updates are handled by Renovate (see renovate.json).
  # Dependabot keys docker deps by image-name-per-directory and cannot
  # cope with this repo pinning several versions of the same image in one
  # directory (e.g. images/mariadb/*.Dockerfile), which aborts its run.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
